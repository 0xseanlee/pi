[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-obf"
version = "0.1.0"
requires-python = ">=3.11"
description = "On-demand private Discord interface for a Lua obfuscation engine"
dependencies = ["discord.py==2.7.1"]

[project.scripts]
dc = "dc_obf.cli:main"

[tool.setuptools.packages.find]
include = ["dc_obf*"]
